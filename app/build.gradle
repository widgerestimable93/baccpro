plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def releaseSigningValues = [
    keystorePath: System.getenv('ANDROID_KEYSTORE_PATH'),
    storePassword: System.getenv('ANDROID_KEYSTORE_PASSWORD'),
    keyAlias: System.getenv('ANDROID_KEY_ALIAS'),
    keyPassword: System.getenv('ANDROID_KEY_PASSWORD')
]
def releaseSigningConfigured = releaseSigningValues.values().every { value ->
    value != null && !value.isBlank()
}

android {
    namespace 'com.baccpro.app'
    compileSdk 33

    defaultConfig {
        applicationId "com.baccpro.app"
        minSdk 21
        targetSdk 33
        versionCode 4
        versionName "2.2.0"
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile rootProject.file(releaseSigningValues.keystorePath)
                storePassword releaseSigningValues.storePassword
                keyAlias releaseSigningValues.keyAlias
                keyPassword releaseSigningValues.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
        debug { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'
}
